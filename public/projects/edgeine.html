<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edgeine — Nathaniel York</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #08090a;
        --text: #e9e9ed;
        --text-2: rgba(233, 233, 237, 0.68);
        --accent: #6f8ee2;
        --accent-light: #8ba6ea;
        --border: rgba(233, 233, 237, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .kicker {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent-light);
        margin: 0;
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        letter-spacing: -0.03em;
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin: 0;
      }
      p {
        max-width: 44ch;
        color: var(--text-2);
        line-height: 1.6;
        margin: 0;
      }
      a {
        margin-top: 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 12px 18px;
        text-decoration: none;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
      }
      a:hover {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
    </style>
  </head>
  <body>
    <p class="kicker">Case study</p>
    <h1>Edgeine</h1>
    <p>The full write-up for this project is on its way. Check back soon, or reach out directly for details in the meantime.</p>
    <a href="/">&larr; Back to portfolio</a>
  </body>
</html>
